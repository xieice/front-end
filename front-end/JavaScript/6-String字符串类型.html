<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 定义声明
        var str = 'hello'
        console.log(typeof(str));
        
        // 连接字符串 + 
        var a = '我'
        var b = '正在复习'
        console.log(a + b + 'javascript')
        // 获取字符串的长度 length
        console.log(b.length)
        // 大小写转换 toUpperCase()、toLowerCase()
        var c = 'abcdefg'
        console.log(c.toUpperCase());
        var d = 'ABCDEFG'
        console.log(d.toLowerCase());
        
        // 移除空格 trim()
        var e = '           哈哈哈    你是谁  ？'
        console.log(e.length);
        console.log(e.trim().length);
        
        
        // 获取单字符  charAt(2)
        var f = '我在加油学习'
        console.log(f.charAt(4));
        
        // 截取字符串  slice(1,5)
        console.log(f.slice(2,4));
        
        // 查找字符串   indexOf('')
        console.log(f.indexOf('加'));
        // 找不到返回-1

        // 替换字符串   replace('','')
        var i = '努力学习前端'
        console.log(i.replace('前端','网络'))

        // 类型转换
        // 将“2025-5-14”时间格式转换为""2025/5/14"
        // 字符串分割split('')  ——>得到一个数组
        // 字符串组合join
        var time = '2025-5-14'
        console.log(time.split('-'));
        console.log(time.split('-').join('/'));








    </script>
</body>
</html>
