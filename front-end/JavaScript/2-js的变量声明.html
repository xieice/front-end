<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>js变量声明</title>
</head>
<body>
    <script>
        var test  //只声明未赋值，undefined
        console.log(test)
        var x = '谢谢'
        console.log(x)
        // 变量类型
        console.log(typeof(x))
    </script>
</body>
</html>
