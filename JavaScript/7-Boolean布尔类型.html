<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 字面量声明
        var a = true
        console.log(typeof(a));
        
        // 隐式转换（几乎所有类型都可以隐式转换为布尔型）
        //             true        false
        // String      非空字符串   空字符串
        // Number      非0数值      0/NaN
        // Array   数组不参与比较时  参与比较的数组
        // Object       √
        // undefined                √
        // null                     √
        // NaN                      √

        console.log(Boolean(''));
        







        // 显式转换
        var x = ''
        console.log(!!x);
        var z = 0
        console.log(!z);
        
        

    </script>
</body>
</html>
