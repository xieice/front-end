<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 原始类型(基础类型)数据，保存在栈内存里
        // number、string、boolean、undefined、null、symbol

        // 复杂类型(引用类型)数据，保存在堆内存里
        // 对象{}、数组[]、函数(){}

        // 字面量方式声明
        var a = 1
        console.log(a);
        
        // 对象式声明
        var b = new Number(2)
        console.log(b);
        
    </script>
</body>
</html>
